[project]
name = "chronos-never-give-up"
version = "0.1.0"
description = "Laboratorio de XAUUSD (Pepperstone / cTrader): explorador de velas y motor de backtest, sin estrategia"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "scipy>=1.14",
    "plotly>=5.24",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    "rich>=13.9",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.119",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]
notebook = [
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
    "kaleido>=0.2.1",
]

[project.scripts]
chronos = "chronos.interface.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "C4", "PTH"]
# ARG002: las firmas de los contratos (Strategy, PositionSizer) declaran
# parámetros que no toda implementación usa; forman parte de la interfaz.
# N818: la jerarquía de errores de dominio usa nombres del dominio, no sufijo Error.
# B027: los hooks opcionales de Strategy son vacíos a propósito, no abstractos.
ignore = ["E501", "ARG002", "N818", "B027"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
packages = ["chronos"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plotly.*", "scipy.*"]
ignore_missing_imports = true
